[project]
name = "comic-manager"
version = "1.0.0"
description = "Gestor de cómics multi-sitio (vercomicsporno, vermangasporno, pawchive)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
    "mysql-connector-python>=8.2",
    "curl-cffi>=0.7",
    "browser-cookie3>=0.22",
    "pycryptodomex>=3.20",
    "beautifulsoup4>=4.12",
    "customtkinter>=5.2",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.12",
    "mypy>=1.7",
    "ruff>=0.1.0",
    "black>=23.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "T20", # flake8-print (print statements)
]
ignore = [
    "E501",  # line too long (we allow 100)
    "B008",  # function calls in default args (common in our code)
    "SIM102", # nested if (sometimes clearer)
    "T201",  # print statements (we use them for CLI output)
]
exclude = [
    "__pycache__",
    ".browser-profile",
    "pawchive_thumbs",
    "*.pyc",
]
[tool.ruff.per-file-ignores]
"gui.py" = ["T201"]
"scraper.py" = ["T201"]
"download.py" = ["T201"]
"brave_cf.py" = ["T201"]
"optimize.py" = ["T201"]
"verify_dl.py" = ["T201"]
"pawchive_api.py" = ["T201"]
"dashboard.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true
exclude = [
    "__pycache__",
    ".browser-profile",
    "pawchive_thumbs",
]

[[tool.mypy.overrides]]
module = [
    "customtkinter",
    "playwright",
    "curl_cffi",
    "browser_cookie3",
    "Cryptodome",
    "mysql.connector",
    "bs4",
    "PIL",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.py$'
exclude = '''
/(
    __pycache__
    | \.browser-profile
    | pawchive_thumbs
    | \.pyc
)/
'''

[tool.coverage.run]
source = ["."]
omit = [
    "*/__pycache__/*",
    "*/tests/*",
    "*/.browser-profile/*",
    "*/pawchive_thumbs/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]